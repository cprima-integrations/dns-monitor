[project]
name = "dns-monitor"
version = "0.1.0"
description = "Multi-provider DNS zone guard against accidental edits and hijacking"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Christian Prior-Mamulyan", email = "cprior@gmail.com"}]
keywords = ["dns", "monitoring", "inwx", "cloudflare", "drift", "guard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
]

# Core library: only DNS provider clients. No CLI, no dotenv.
# Credentials are passed programmatically by the caller.
dependencies = [
    "inwx-domrobot>=3.2.0",
    "cloudflare>=3.0",
]

[project.optional-dependencies]
# pip install dns-monitor[cli]
cli = [
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
dns-monitor = "dns_monitor.cli.app:main"

[project.urls]
"Source" = "https://github.com/cprima-integrations/dns-monitor"
"Bug Tracker" = "https://github.com/cprima-integrations/dns-monitor/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dns_monitor"]

[tool.ruff]
target-version = "py311"
